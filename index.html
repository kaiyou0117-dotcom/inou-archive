<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>異能スレ アーカイブ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site">
  <div class="inner">
    <a class="logo" href="#/">異能スレ アーカイブ<small>ここだけ異能のある世界 過去ログ保管庫</small></a>
    <nav class="main">
      <a href="#/s">レス検索</a>
      <label class="switch"><input type="checkbox" id="darkmode">ダークモード</label>
    </nav>
    <form class="search-top" id="top-search">
      <input type="text" id="q-top" placeholder="全スレのレスを検索">
      <button class="btn" type="submit">検索</button>
    </form>
  </div>
</header>
<main id="app"><p class="muted">読み込み中…</p></main>
<footer class="site">非公式の個人アーカイブです。あにまん掲示板の過去ログを、閲覧用に保存したものです。</footer>
<script src="app.js"></script>
</body>
</html>
